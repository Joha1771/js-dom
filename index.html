<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dom</title>
  </head>
  <body>

    <section class="flex items-center justify-center pt-[50px]">
      <div class="container mx-auto px-[10px] flex gap-[100px]">

        <div class="svetofor flex flex-col gap-[10px] items-center">
          <h2 class="bg-gray-500 px-[50px] text-white">Svetofor</h2>
          <div class="flex gap-[20px]">
            <button class="px-5 bg-green-500 rounded sf-btn">Start</button>
            <button class="px-5 bg-red-500 rounded sf-stop-btn">Stop</button>
          </div>
        </div>

        <div class="secundomer flex flex-col gap-[10px] items-center">
          <h2 class="bg-gray-500 px-[70px] text-white">Timer</h2>
          <div class="flex gap-[20px]">
            <button class="px-5 bg-green-500 rounded sk-btn">Start</button>
            <button class="px-5 bg-red-500 rounded sk-stop-btn">Stop</button>
          </div>
          <p class="counter">0</p>
        </div>

        <div class="timer flex flex-col gap-[10px] items-center">
          <h2 class="bg-gray-500 px-[70px] text-white">Time</h2>
          <div class="flex gap-[20px]">
            <button class="px-5 bg-green-500 rounded ph-btn">Start</button>
            <button class="px-5 bg-red-500 rounded ph-stop-btn">Stop</button>
          </div>
          <p>
            <span class="hour">00</span>:
            <span class="minutes">00</span>:
            <span class="second">00</span>
          </p>
        </div>

      </div>
    </section>

    <section class="flex justify-center pt-[150px] text-white">
      <div class="relative bg-no-repeat bg-[url('/bg-image.png')] w-[1200px] h-[500px]">

        <div class="absolute text-center -translate-x-1/2 top-10 left-1/2">
          <h2 class="text-2xl font-bold">Joha City</h2>
          <button class="px-5 bg-gray-500 window-on">ON</button>
          <button class="px-5 bg-orange-500 window-off">OFF</button>
        </div>

      </div>
    </section>

    <section class="flex justify-center pt-[100px]">
      <div class="relative w-[1200px]">

        <div class="flex gap-10 mb-5">
          <h2 class="text-3xl font-bold">Press to start</h2>
          <button class="px-10 text-2xl text-white bg-green-600 rounded car-btn">
            Start
          </button>
        </div>

        <img src="/fon.jpg" class="w-full" />

        <div class="absolute bottom-[50px] left-[100px] flex gap-10">
          <img src="/red-car.png" class="w-[100px] red-car" />
          <img src="/orange-car.jpg" class="w-[100px] orange-car" />
        </div>

      </div>
    </section>

    <!-- ВАЖНО -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
